# ============================
# API Gateway - Local Properties
# ============================
server.port=8080
spring.application.name=api-gateway

# Import configuration from Config Server
spring.config.import=configserver:http://localhost:8888

# ============================
# Route Definitions
# ============================
# Each route maps a URL pattern to a microservice registered in Eureka.
# The gateway uses the Eureka name (lb://ms-name) to find the ms dynamically.
# "lb://" means "load balanced" — Eureka resolves the actual host:port.

# --- ms-bundle (Epic 2: Package management) ---
# CRUD operations for travel packages
spring.cloud.gateway.mvc.routes[0].id=ms-bundle
spring.cloud.gateway.mvc.routes[0].uri=lb://ms-bundle
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/bundle/**

# --- ms-search (Epic 3: Search & explore packages) ---
# Search/filter operations — must be BEFORE ms-bundle route
# to match /api/v1/bundle/search specifically
# NOTE: Since Spring Cloud Gateway evaluates routes in order,
# we put search FIRST so /api/v1/bundle/search goes to ms-search
# and all other /api/v1/bundle/** go to ms-bundle.
# Actually, both share /api/v1/bundle path, so we handle it differently:
# ms-search will expose its endpoint at /api/v1/search/**
spring.cloud.gateway.mvc.routes[1].id=ms-search
spring.cloud.gateway.mvc.routes[1].uri=lb://ms-search
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/search/**

# --- ms-reservation (Epic 4: Reservations) ---
# Create, list, and manage reservations
spring.cloud.gateway.mvc.routes[2].id=ms-reservation
spring.cloud.gateway.mvc.routes[2].uri=lb://ms-reservation
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/reservations/**

# --- ms-payment (Epic 5: Payments) ---
# Process payments for reservations
spring.cloud.gateway.mvc.routes[3].id=ms-payment
spring.cloud.gateway.mvc.routes[3].uri=lb://ms-payment
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/payments/**

# --- ms-tracking (Epic 6: Tracking & receipts) ---
# Reservation tracking, receipts, user-facing queries
spring.cloud.gateway.mvc.routes[4].id=ms-tracking
spring.cloud.gateway.mvc.routes[4].uri=lb://ms-tracking
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/tracking/**

# --- ms-reports (Epic 7: Reports) ---
# Sales reports and package rankings
spring.cloud.gateway.mvc.routes[5].id=ms-reports
spring.cloud.gateway.mvc.routes[5].uri=lb://ms-reports
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/v1/reports/**

# --- Users (Keycloak sync via ms-tracking or dedicated endpoint) ---
spring.cloud.gateway.mvc.routes[6].id=ms-users
spring.cloud.gateway.mvc.routes[6].uri=lb://ms-tracking
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/v1/users/**